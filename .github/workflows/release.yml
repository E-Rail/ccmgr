name: Release

on:
  push:
    tags:
      - "v*"
  # Rebuild the binaries for a tag that already exists - for when a release
  # build fails for a reason outside the code, like a retired runner image.
  # The tag is left where it is; only the release's assets are (re)uploaded.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v0.1.12"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: tar -czf ccmgr-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ccmgr

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ccmgr-${{ matrix.target }}.tar.gz
